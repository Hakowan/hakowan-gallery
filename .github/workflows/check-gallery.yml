name: Check gallery

on:
  pull_request:
    paths:
      - "gallery/**"
      - ".github/workflows/check-gallery.yml"
  push:
    branches: [main]
    paths:
      - "gallery/**"
      - ".github/workflows/check-gallery.yml"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify recipe artifacts are current
        run: python gallery/render_gallery.py --check-artifacts

      - name: Regenerate recipe documentation index
        run: python gallery/render_gallery.py --index

      - name: Verify generated documentation is current
        run: git diff --exit-code -- gallery/README.md gallery/*/README.md

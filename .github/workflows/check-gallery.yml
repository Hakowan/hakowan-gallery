name: Check gallery

on:
  pull_request:
    paths:
      - "gallery/**"
      - "pixi.toml"
      - "pixi.lock"
      - ".github/workflows/check-gallery.yml"
  push:
    branches: [main]
    paths:
      - "gallery/**"
      - "pixi.toml"
      - "pixi.lock"
      - ".github/workflows/check-gallery.yml"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: prefix-dev/setup-pixi@v0.11.2
        with:
          pixi-version: v0.66.0

      - name: Verify recipe artifacts are current
        run: pixi run python gallery/render_gallery.py --check-artifacts

      - name: Regenerate recipe documentation index
        run: pixi run python gallery/render_gallery.py --index

      - name: Verify generated documentation is current
        run: git diff --exit-code -- gallery/README.md gallery/*/README.md
